name: CI

on:
  pull_request:
    branches:
      - dev
  push:
    branches:
      - dev

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      DB_URL: jdbc:postgresql://localhost:5432/pebble
      DB_USERNAME: pebble
      DB_PASSWORD: pebble-local
    services:
      postgres:
        image: postgres:17.11-alpine
        env:
          POSTGRES_DB: pebble
          POSTGRES_USER: pebble
          POSTGRES_PASSWORD: pebble-local
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U pebble -d pebble"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7.4-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic

      - name: Run tests and build deployment JAR
        run: ./gradlew clean test bootJar
