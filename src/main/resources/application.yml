# src/main/resources/application.yml

spring:
  application:
    name: pebble-api

  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}

  jpa:
    open-in-view: false

    hibernate:
      ddl-auto: validate

    properties:
      hibernate:
        format_sql: true
        show_sql: false
        default_batch_fetch_size: 100