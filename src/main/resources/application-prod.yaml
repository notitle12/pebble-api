# 운영에는 로컬 자격 증명과 localhost 기본값을 사용하지 않는다.
# 실제 값은 배포 플랫폼의 보호된 환경변수/Secret으로 제공한다.
server:
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: pebble-api
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT:6379}
      username: ${REDIS_USERNAME:default}
      password: ${REDIS_PASSWORD}
      ssl:
        enabled: ${REDIS_SSL_ENABLED:true}

pebble:
  admin:
    bootstrap:
      enabled: ${ADMIN_BOOTSTRAP_ENABLED:false}
      login-id: ${ADMIN_BOOTSTRAP_LOGIN_ID:}
      password: ${ADMIN_BOOTSTRAP_PASSWORD:}
  security:
    cors:
      allowed-origins: ${CORS_ALLOWED_ORIGINS}
  auth:
    naver:
      client-id: ${NAVER_CLIENT_ID}
      client-secret: ${NAVER_CLIENT_SECRET}
      redirect-uri: ${NAVER_REDIRECT_URI}
      authorization-uri: https://nid.naver.com/oauth2.0/authorize
      token-uri: https://nid.naver.com/oauth2.0/token
      profile-uri: https://openapi.naver.com/v1/nid/me
      state-ttl: 5m
      # 네이버 개발자센터 TERMS_20261022/PRIVACY_20261022 필수 동의 및 만14세 제한 설정과 일치해야 한다.
      plus:
        enabled: ${NAVER_PLUS_ENABLED:true}
        age-restricted: ${NAVER_PLUS_AGE_RESTRICTED:true}
        terms-tag: ${NAVER_PLUS_TERMS_TAG:TERMS_20261022}
        privacy-tag: ${NAVER_PLUS_PRIVACY_TAG:PRIVACY_20261022}
        terms-version: ${NAVER_PLUS_TERMS_VERSION:2026-10-22}
        privacy-version: ${NAVER_PLUS_PRIVACY_VERSION:2026-10-22}
    jwt:
      issuer: ${JWT_ISSUER}
      audience: ${JWT_AUDIENCE}
      private-key-base64: ${JWT_PRIVATE_KEY_BASE64:}
      public-key-base64: ${JWT_PUBLIC_KEY_BASE64:}
      key-id: ${JWT_KEY_ID}
    refresh-token:
      pepper-base64: ${REFRESH_TOKEN_PEPPER_BASE64}
      pepper-version: ${REFRESH_TOKEN_PEPPER_VERSION}
      previous-peppers: {}
